[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ciel-gate"
version = "1.0.0"
description = "Agent Change Control / Policy Firewall for Coding Agents"
authors = [{ name = "JPatronC92" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "twine>=5.0.0",
    "ruff",
    "mypy"
]
explain = []

[project.scripts]
ciel-gate = "ciel_gate.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ciel_gate*"]
