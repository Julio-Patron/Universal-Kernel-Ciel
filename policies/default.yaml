version: 1

protected_paths:
  - pattern: "src/auth/**"
    action: require_approval
  - pattern: ".github/workflows/**"
    action: require_approval
  - pattern: "**/*.sql"
    action: require_approval

deny:
  file_patterns:
    - "**/.env"
    - "**/*.pem"
  commands:
    - sudo
    - curl
    - wget
    - rm

limits:
  changed_files: 25
  total_changed_lines: 1500

checks:
  - command: pytest
    args: ["-q"]
    required: true
