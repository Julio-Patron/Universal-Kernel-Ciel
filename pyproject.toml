[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ciel-kernel"
version = "0.1.0"
description = "Ciel Kernel V0: Intelligence and Context Governance OS"
authors = [{ name = "JPatronC92" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ciel = "ciel.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ciel*", "skills*", "memory*"]
